[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openrad"
version = "0.1.0"
description = "An open-source toolkit for radiation detectors: pluggable device drivers, spectrum/track capture, and a local library."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "openrad contributors" }]
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
]

[project.optional-dependencies]
viz = [
    "matplotlib>=3.8",
    "numpy>=1.26",
]
ble = [
    "bleak>=0.22",
]
usb = [
    "pyusb>=1.2",
]
dev = [
    "openrad[viz]",
    "openrad[ble]",
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
openrad = "openrad.cli.main:main"

[project.urls]
Homepage = "https://github.com/nulvox/openrad"

[tool.hatch.build.targets.wheel]
packages = ["src/openrad"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: typer requires calling Argument()/Option() in function defaults.
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
